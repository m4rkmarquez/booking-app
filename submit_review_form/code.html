<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Submit Review Form</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0f6df0",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101822",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .star-filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#0d131c] dark:text-slate-100 min-h-screen">
<div class="relative flex h-full min-h-screen w-full flex-col max-w-[430px] mx-auto bg-white dark:bg-background-dark shadow-2xl">
<!-- TopAppBar -->
<div class="flex items-center bg-white dark:bg-background-dark p-4 pb-2 justify-between border-b border-slate-100 dark:border-slate-800 sticky top-0 z-10">
<div class="text-[#0d131c] dark:text-slate-100 flex size-10 items-center justify-start cursor-pointer">
<span class="material-symbols-outlined">close</span>
</div>
<h2 class="text-[#0d131c] dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Submit Review</h2>
<div class="size-10"></div> <!-- Spacer for symmetry -->
</div>
<div class="flex-1 overflow-y-auto">
<!-- ProfileHeader (Summary of the Job) -->
<div class="flex p-4 @container border-b border-slate-50 dark:border-slate-900">
<div class="flex w-full flex-col gap-4">
<div class="flex gap-4 items-center">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full h-16 w-16 shadow-sm border border-slate-100 dark:border-slate-800" data-alt="Profile picture of a professional plumber" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCeR8UawvaCIxmmcBfGq9azQhqO1CfQZdBdKtrX45dZMl-Y_lRUjxsOl2ixZNGsXvpRSSka0n4nlN5dL1bKDdTA72m2RHn06kc7HRrndRerAK5g9iHl9hFEM4Q4DtvMhFmOAJUhfYgVNBgjPpz1vdanJKPq_UWqHcd3ziZvBhBp-seJ-YxCFOyGoarquNYQ0woFzBtTAhCHUhXwjytPq4_FF1bc0ttRR-PJwx-IpPJaF_FPMrjsTYdgu-5eA4xoNSoP__QudDBsMuUK");'>
</div>
<div class="flex flex-col justify-center">
<p class="text-[#0d131c] dark:text-white text-lg font-bold leading-tight">Marcus Thompson</p>
<p class="text-[#4b6c9b] dark:text-slate-400 text-sm font-medium">Professional Plumber</p>
<p class="text-[#4b6c9b] dark:text-slate-500 text-xs mt-0.5">Completed: Oct 12, 2:30 PM</p>
</div>
</div>
</div>
</div>
<!-- SectionHeader: Rating Prompt -->
<div class="mt-4">
<h4 class="text-[#0d131c] dark:text-white text-base font-bold leading-normal tracking-tight px-4 pt-4">How was your experience?</h4>
<p class="text-[#4b6c9b] dark:text-slate-400 text-sm px-4">Tap a star to give your rating</p>
</div>
<!-- Interactive Rating Component (Customized Star Selector) -->
<div class="flex justify-center gap-2 p-6">
<span class="material-symbols-outlined star-filled text-primary !text-4xl cursor-pointer">star</span>
<span class="material-symbols-outlined star-filled text-primary !text-4xl cursor-pointer">star</span>
<span class="material-symbols-outlined star-filled text-primary !text-4xl cursor-pointer">star</span>
<span class="material-symbols-outlined star-filled text-primary !text-4xl cursor-pointer">star</span>
<span class="material-symbols-outlined text-slate-300 dark:text-slate-700 !text-4xl cursor-pointer">star</span>
</div>
<!-- Rating Summary (Stats view for context) -->
<div class="px-4 py-2">
<div class="bg-background-light dark:bg-slate-900/50 rounded-xl p-4 flex flex-wrap gap-x-6 gap-y-4">
<div class="flex flex-col gap-1 items-center justify-center">
<p class="text-[#0d131c] dark:text-white text-3xl font-black leading-tight">4.8</p>
<div class="flex gap-0.5">
<span class="material-symbols-outlined star-filled text-primary !text-[14px]">star</span>
<span class="material-symbols-outlined star-filled text-primary !text-[14px]">star</span>
<span class="material-symbols-outlined star-filled text-primary !text-[14px]">star</span>
<span class="material-symbols-outlined star-filled text-primary !text-[14px]">star</span>
<span class="material-symbols-outlined star-filled text-primary !text-[14px]">star_half</span>
</div>
<p class="text-[#4b6c9b] dark:text-slate-500 text-[10px] font-medium uppercase tracking-wider">Overall Rating</p>
</div>
<div class="grid flex-1 grid-cols-[12px_1fr_30px] items-center gap-y-1.5">
<p class="text-[#0d131c] dark:text-slate-400 text-[10px] font-bold">5</p>
<div class="flex h-1.5 flex-1 overflow-hidden rounded-full bg-[#cfd9e8] dark:bg-slate-800"><div class="rounded-full bg-primary" style="width: 85%;"></div></div>
<p class="text-[#4b6c9b] dark:text-slate-500 text-[10px] font-normal text-right">85%</p>
<p class="text-[#0d131c] dark:text-slate-400 text-[10px] font-bold">4</p>
<div class="flex h-1.5 flex-1 overflow-hidden rounded-full bg-[#cfd9e8] dark:bg-slate-800"><div class="rounded-full bg-primary" style="width: 12%;"></div></div>
<p class="text-[#4b6c9b] dark:text-slate-500 text-[10px] font-normal text-right">12%</p>
<p class="text-[#0d131c] dark:text-slate-400 text-[10px] font-bold">3</p>
<div class="flex h-1.5 flex-1 overflow-hidden rounded-full bg-[#cfd9e8] dark:bg-slate-800"><div class="rounded-full bg-primary" style="width: 3%;"></div></div>
<p class="text-[#4b6c9b] dark:text-slate-500 text-[10px] font-normal text-right">3%</p>
</div>
</div>
</div>
<!-- TextField: Comments -->
<div class="flex flex-col gap-4 px-4 py-4">
<label class="flex flex-col w-full">
<p class="text-[#0d131c] dark:text-white text-base font-bold leading-normal pb-2">Your Review</p>
<textarea class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#0d131c] dark:text-slate-200 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#cfd9e8] dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50 placeholder:text-[#4b6c9b] dark:placeholder:text-slate-500 p-4 text-sm font-normal leading-relaxed min-h-[140px]" placeholder="Tell us about the quality of work, punctuality, and professionalism..."></textarea>
</label>
</div>
<!-- Photo Upload Section -->
<div class="px-4 py-2">
<p class="text-[#0d131c] dark:text-white text-base font-bold leading-normal pb-3">Add Photos</p>
<div class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide">
<!-- Add Photo Trigger -->
<div class="flex flex-col items-center justify-center min-w-[100px] h-[100px] rounded-xl border-2 border-dashed border-[#cfd9e8] dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50 cursor-pointer">
<span class="material-symbols-outlined text-primary">add_a_photo</span>
<span class="text-[10px] font-bold text-primary mt-1">ADD PHOTO</span>
</div>
<!-- Sample Uploaded Photo -->
<div class="relative min-w-[100px] h-[100px] rounded-xl bg-center bg-cover border border-slate-100 dark:border-slate-800" data-alt="Photo of a newly installed kitchen faucet" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuABCWmZtL1khQEDwta13qntzKe9HEl688dc7Awos1sHaB6W567WrSest0z5U8CUG8xhYN0_6G_E6D9F9q9z3vCJFDV5qpdgzGJvQ-YXW4Sj_u9O7A-wiq3cEHGFbmqqzJcC_URfN7QcSEezLVPwvhNL4_ohDVAKldYISf9kDtNS46a5YwAwpuRID5rsyKcyw04kgSukNY4dsmOAulcwCrMtph3IHELHdi41KUS8eQlul-r-ub5br1GATshX2QQSLZsP0T00j9Hyrp2U");'>
<div class="absolute top-1 right-1 bg-black/50 rounded-full p-0.5 text-white cursor-pointer">
<span class="material-symbols-outlined !text-[16px]">close</span>
</div>
</div>
<!-- Sample Uploaded Photo 2 -->
<div class="relative min-w-[100px] h-[100px] rounded-xl bg-center bg-cover border border-slate-100 dark:border-slate-800" data-alt="Close up of pipe work under sink" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDtvXrLWTYzUh3brlOxtWQ0L51DsLNQ5YDLkYTwB5RCAeoHqZGcicGja-JOmMfnLUQKvY63KDU_KM9CB9S0kOG-vd7sdivGpa7CT6uQuFNUWBOe9KbHQJKF3_OsoK_hY4JOvR8ScwS3Q_8SlsMK3i_NH4o-FB02dY60AnnE467SRCKxu9FG4YNj3ZhE4M91f5Y2U3imn6MTLBheD62zsjcHLGDXe6zCZ91-8KndslJcLNBJ-owzB4_2SKeBeSFOX4t1ZmLGYyBvgW6c");'>
<div class="absolute top-1 right-1 bg-black/50 rounded-full p-0.5 text-white cursor-pointer">
<span class="material-symbols-outlined !text-[16px]">close</span>
</div>
</div>
</div>
</div>
<div class="h-24"></div> <!-- Space for sticky button -->
</div>
<!-- Submit Button Footer -->
<div class="absolute bottom-0 left-0 right-0 p-4 bg-white dark:bg-background-dark border-t border-slate-100 dark:border-slate-800 pb-8">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg transition-colors flex items-center justify-center gap-2">
<span>Submit Review</span>
<span class="material-symbols-outlined !text-[20px]">send</span>
</button>
</div>
</div>
</body></html>
