<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Booking Details</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0f6df0",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101822",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#0d131c] dark:text-slate-100 min-h-screen">
<!-- Top Navigation Bar -->
<div class="sticky top-0 z-50 bg-background-light dark:bg-background-dark/95 backdrop-blur-sm border-b border-slate-200 dark:border-slate-800">
<div class="flex items-center p-4 justify-between max-w-md mx-auto">
<button class="text-[#0d131c] dark:text-slate-100 flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back_ios</span>
</button>
<h2 class="text-[#0d131c] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-8">Booking Details</h2>
</div>
</div>
<main class="max-w-md mx-auto pb-32">
<!-- Service Card -->
<div class="p-4">
<div class="bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 shadow-sm p-4 rounded-xl">
<div class="flex items-center justify-between gap-4">
<div class="flex flex-col gap-1 flex-[2_2_0px]">
<p class="text-xs font-bold uppercase tracking-wider text-primary mb-0.5">Selected Service</p>
<p class="text-[#0d131c] dark:text-white text-lg font-bold leading-tight">Professional Plumbing Service</p>
<p class="text-[#4b6c9b] dark:text-slate-400 text-sm font-normal leading-normal flex items-center gap-1">
<span class="material-symbols-outlined text-sm text-yellow-500 fill-1" style="font-variation-settings: 'FILL' 1;">star</span>
                            Verified Expert • 4.9 (120 reviews)
                        </p>
</div>
<div class="w-20 h-20 bg-center bg-no-repeat bg-cover rounded-lg flex-shrink-0 border border-slate-100 dark:border-slate-800" data-alt="Professional plumber working on a sink" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAcmfd4mKuFNjlCf9J7HgwAlQjzU-2sPAB54_GJxac4rbCTpdNuu2iZ3pkS8wfn7RXNH7m3kqk63o2FE1EzBq0YwvW6Gjb55ZFktcWrXMVs6hTjK1oz8YZ5U8MsysTl-UTMZCLKzQaeT-ZXyK5jbNMgq4dJPk-goD7RiRp_Ei_lbEpp4NtMgq37X9b1sk_6zxpmcRrZYjunbMUkiywXLKIQL5OVOj-AVr3l6At5dv7nWUPUmeXaHAVDIELkEFzVl9oZ31KRoosLlH-O");'>
</div>
</div>
</div>
</div>
<!-- Section Header: Date Selection -->
<h3 class="text-[#0d131c] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] px-4 pt-2">Select Date</h3>
<!-- Calendar Picker -->
<div class="px-4">
<div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-100 dark:border-slate-800 mt-2">
<div class="flex flex-col gap-0.5 p-2">
<div class="flex items-center p-1 justify-between">
<button class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined text-xl">chevron_left</span>
</button>
<p class="text-[#0d131c] dark:text-white text-base font-bold leading-tight flex-1 text-center">October 2023</p>
<button class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined text-xl">chevron_right</span>
</button>
</div>
<div class="grid grid-cols-7 text-center">
<p class="text-slate-400 dark:text-slate-500 text-[11px] font-bold uppercase py-2">Sun</p>
<p class="text-slate-400 dark:text-slate-500 text-[11px] font-bold uppercase py-2">Mon</p>
<p class="text-slate-400 dark:text-slate-500 text-[11px] font-bold uppercase py-2">Tue</p>
<p class="text-slate-400 dark:text-slate-500 text-[11px] font-bold uppercase py-2">Wed</p>
<p class="text-slate-400 dark:text-slate-500 text-[11px] font-bold uppercase py-2">Thu</p>
<p class="text-slate-400 dark:text-slate-500 text-[11px] font-bold uppercase py-2">Fri</p>
<p class="text-slate-400 dark:text-slate-500 text-[11px] font-bold uppercase py-2">Sat</p>
<!-- Calendar Days -->
<button class="h-10 w-full text-slate-400 dark:text-slate-600 col-start-4 text-sm font-medium">1</button>
<button class="h-10 w-full text-slate-400 dark:text-slate-600 text-sm font-medium">2</button>
<button class="h-10 w-full text-[#0d131c] dark:text-slate-200 text-sm font-medium">3</button>
<button class="h-10 w-full text-[#0d131c] dark:text-slate-200 text-sm font-medium">4</button>
<button class="h-10 w-full text-white text-sm font-medium">
<div class="flex size-8 mx-auto items-center justify-center rounded-full bg-primary shadow-lg shadow-primary/30">5</div>
</button>
<button class="h-10 w-full text-[#0d131c] dark:text-slate-200 text-sm font-medium">6</button>
<button class="h-10 w-full text-[#0d131c] dark:text-slate-200 text-sm font-medium">7</button>
<button class="h-10 w-full text-[#0d131c] dark:text-slate-200 text-sm font-medium">8</button>
<button class="h-10 w-full text-[#0d131c] dark:text-slate-200 text-sm font-medium">9</button>
<button class="h-10 w-full text-[#0d131c] dark:text-slate-200 text-sm font-medium">10</button>
<button class="h-10 w-full text-[#0d131c] dark:text-slate-200 text-sm font-medium">11</button>
<button class="h-10 w-full text-[#0d131c] dark:text-slate-200 text-sm font-medium">12</button>
<button class="h-10 w-full text-[#0d131c] dark:text-slate-200 text-sm font-medium">13</button>
<button class="h-10 w-full text-[#0d131c] dark:text-slate-200 text-sm font-medium">14</button>
</div>
</div>
</div>
</div>
<!-- Section Header: Available Slots -->
<h3 class="text-[#0d131c] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] px-4 pt-6">Available Time Slots</h3>
<!-- Time Slots -->
<div class="flex flex-wrap gap-2 px-4 py-3">
<button class="px-4 py-2 rounded-lg bg-primary text-white font-medium text-sm shadow-sm">09:00 AM</button>
<button class="px-4 py-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 font-medium text-sm hover:border-primary transition-colors">10:30 AM</button>
<button class="px-4 py-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 font-medium text-sm hover:border-primary transition-colors">12:00 PM</button>
<button class="px-4 py-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 font-medium text-sm hover:border-primary transition-colors">02:30 PM</button>
<button class="px-4 py-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 font-medium text-sm hover:border-primary transition-colors">04:00 PM</button>
<button class="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 border border-transparent text-slate-400 dark:text-slate-600 font-medium text-sm cursor-not-allowed" disabled="">05:30 PM</button>
</div>
<!-- Job Details Section -->
<h3 class="text-[#0d131c] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] px-4 pt-6">Job Details / Notes</h3>
<div class="px-4 py-3">
<textarea class="w-full rounded-xl border-slate-200 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-200 focus:border-primary focus:ring-primary text-sm p-4 placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="Describe the job in detail (e.g., Leaking kitchen faucet, model BrandX...)" rows="4"></textarea>
</div>
<!-- Price Breakdown -->
<div class="px-4 py-4 space-y-2">
<div class="flex justify-between items-center text-sm">
<span class="text-slate-500 dark:text-slate-400">Hourly Rate</span>
<span class="text-[#0d131c] dark:text-slate-200 font-medium">$45.00/hr</span>
</div>
<div class="flex justify-between items-center text-sm">
<span class="text-slate-500 dark:text-slate-400">Service Fee</span>
<span class="text-[#0d131c] dark:text-slate-200 font-medium">$5.00</span>
</div>
<div class="flex justify-between items-center text-base pt-2 border-t border-slate-200 dark:border-slate-800">
<span class="font-bold text-[#0d131c] dark:text-white">Estimated Total</span>
<span class="font-bold text-primary">$50.00</span>
</div>
</div>
</main>
<!-- Bottom Action Bar -->
<div class="fixed bottom-0 left-0 right-0 bg-white/80 dark:bg-background-dark/80 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800 p-4 z-50">
<div class="max-w-md mx-auto">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
<span>Confirm Booking</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<!-- iOS Indicator Bar Spacer -->
<div class="h-4"></div>
</div>
</div>
</body></html>
